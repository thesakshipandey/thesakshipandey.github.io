- title: Research Projects
  type: time_table
  contents:
    - title: Multi-Expert Hybrid Retrieval for Movie Recommendation
      institution: M.S. Thesis · IIT Bombay · Guide — Prof. Arpit Agarwal
      year: Aug 2025 – Present
      description:
        - Designed a multi-expert retrieval system combining semantic, lexical, collaborative, and emotion-aware experts
        - Developed a learned query router trained with Bradley–Terry–Luce pairwise loss over 9,000 human-judged movie pairs
        - Achieved up to 4.5% higher pairwise agreement over strong baselines (BGE-Reranker, Qwen-1.5B, Kimi-K2) on MovieLens-100K
    - title: Indian Multilingual Jailbreaking
      institution: CS626 — NLP · IIT Bombay · Guide — Prof. Pushpak Bhattacharyya
      year: Aug 2024 – May 2025
      description:
        - Built Indic-JailbreakBench — 1,668 multilingual malicious prompts across 12 harm categories
        - Proposed four novel jailbreak techniques achieving up to 35% higher ASR in Indic languages versus English
        - Evaluated six state-of-the-art LLMs using a multi-judge ASR framework for cross-lingual safety assessment
    - title: Reinforcement Learning for Side-Channel CNN Design
      institution: R&D · IIT Bombay · Guide — Prof. Shivaram K. & Sayandeep S.
      year: Jan – May 2025
      description:
        - Built a Q-learning agent that automatically composes 1D-CNN architectures for profiling-based SCA
        - Engineered composite reward functions combining guessing-entropy convergence, validation accuracy, and model-size penalty
        - Executed >2,700 architecture trials on ASCAD, DPAContest v4, and CHES CTF datasets

