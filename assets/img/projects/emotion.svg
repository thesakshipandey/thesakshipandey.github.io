  <text x="80" y="300" font-size="28" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="white">Cross-Lingual Emotion</text>
  <text x="80" y="338" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#c7d2fe" opacity="0.85">Teacher-Student Distillation · CS772</text>
  <rect x="80" y="360" width="130" height="24" rx="4" fill="#3730a3" opacity="0.4"/>
  <text x="90" y="377" font-size="12" font-family="monospace" fill="#c7d2fe">3.3× over zero-shot</text>
