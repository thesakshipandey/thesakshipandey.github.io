  <text x="148" y="204" font-size="10" fill="#e0e7ff" font-family="monospace">Bengali</text>
  <rect x="209" y="190" width="62" height="20" rx="3" fill="#312e81" opacity="0.6"/>
  <text x="215" y="204" font-size="10" fill="#e0e7ff" font-family="monospace">Marathi</text>
  <rect x="280" y="190" width="65" height="20" rx="3" fill="#312e81" opacity="0.5"/>
