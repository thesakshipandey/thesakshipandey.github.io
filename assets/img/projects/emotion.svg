      <stop offset="0%" style="stop-color:#0f0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:0.5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="5" height="420" fill="#818cf8"/>
  <circle cx="700" cy="100" r="140" fill="#3730a3" opacity="0.12"/>
  <!-- Teacher model -->
