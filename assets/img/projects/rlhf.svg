<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1007;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:0.5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="5" height="420" fill="#f59e0b"/>
  <circle cx="700" cy="100" r="140" fill="#b45309" opacity="0.12"/>
  <!-- RL loop diagram -->
  <!-- Policy box -->
  <rect x="85" y="135" width="90" height="40" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
  <text x="95" y="160" font-size="13" fill="#fde68a" font-family="monospace">Policy π</text>
  <!-- Reward box -->
  <rect x="255" y="135" width="90" height="40" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
  <text x="262" y="160" font-size="13" fill="#fde68a" font-family="monospace">Reward r</text>
  <!-- GPT-2 box -->
  <rect x="170" y="220" width="90" height="40" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
  <text x="178" y="245" font-size="12" fill="#fcd34d" font-family="monospace">GPT-2</text>
  <!-- Arrows -->
  <line x1="175" y1="155" x2="250" y2="155" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="250,150 262,155 250,160" fill="#fbbf24"/>
  <line x1="300" y1="175" x2="300" y2="215" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="215" y1="215" x2="130" y2="180" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- VPG label -->
  <text x="170" y="120" font-size="12" fill="#fcd34d" font-family="monospace" opacity="0.8">VPG update ↑</text>
  <!-- Text -->
  <text x="80" y="300" font-size="30" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="white">RLHF Pipeline</text>
  <text x="80" y="338" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#fde68a" opacity="0.85">Vanilla Policy Gradient · GPT-2</text>
  <rect x="80" y="360" width="130" height="24" rx="4" fill="#92400e" opacity="0.4"/>
  <text x="90" y="377" font-size="12" font-family="monospace" fill="#fde68a">From Scratch · Self Project</text>
