<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#166534;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="5" height="420" fill="#22c55e"/>
  <circle cx="700" cy="100" r="130" fill="#15803d" opacity="0.12"/>
  <!-- Signboard rectangle -->
  <rect x="85" y="130" width="180" height="90" rx="5" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <!-- Hindi-like text lines (abstract) -->
  <line x1="105" y1="158" x2="245" y2="158" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
  <line x1="105" y1="174" x2="210" y2="174" stroke="#4ade80" stroke-width="2" opacity="0.4"/>
  <line x1="105" y1="190" x2="230" y2="190" stroke="#4ade80" stroke-width="1.5" opacity="0.3"/>
  <!-- Arrow -->
  <line x1="278" y1="175" x2="318" y2="175" stroke="#86efac" stroke-width="2.5"/>
  <polygon points="318,170 330,175 318,180" fill="#86efac"/>
  <!-- English output box -->
  <rect x="335" y="145" width="130" height="60" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.5" opacity="0.8"/>
  <text x="345" y="168" font-size="12" fill="#86efac" font-family="monospace">HOSPITAL</text>
  <text x="345" y="185" font-size="12" fill="#4ade80" font-family="monospace" opacity="0.7">अस्पताल</text>
  <!-- Accuracy badge -->
  <rect x="335" y="215" width="85" height="22" rx="4" fill="#166534" opacity="0.7"/>
  <text x="345" y="231" font-size="12" fill="#86efac" font-family="monospace">92% acc.</text>
  <!-- Text -->
  <text x="80" y="300" font-size="30" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="white">Signboard OCR</text>
  <text x="80" y="338" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#86efac" opacity="0.85">Hindi→English Transliteration · CS725</text>
  <rect x="80" y="360" width="145" height="24" rx="4" fill="#166534" opacity="0.5"/>
  <text x="90" y="377" font-size="12" font-family="monospace" fill="#86efac">Faster R-CNN · GRU · EasyOCR</text>
</svg>
